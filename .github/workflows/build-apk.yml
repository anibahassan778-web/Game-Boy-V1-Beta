name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install Components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "platform-tools" || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: false

      - name: Prepare Secrets, Environment & Keystore
        run: |
          echo "=== Configuring Build Environment ==="
          
          # 1. Prepare .env for secrets-gradle-plugin
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # 2. Setup debug.keystore
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi

          # Fallback: Generate a standard debug keystore if missing
          if [ ! -f debug.keystore ]; then
            echo "Generating fresh debug.keystore fallback..."
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 3. Ensure placeholder google-services.json if plugin requires it
          if [ ! -f app/google-services.json ]; then
            echo "Creating dummy google-services.json..."
            echo '{"project_info":{"project_number":"0","project_id":"dummy","storage_bucket":"dummy.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"com.example"}},"oauth_client":[],"api_key":[{"current_key":"dummy"}],"services":{"analytics_service":{"status":1}}}]}' > app/google-services.json
          fi

          # 4. Repair or generate Gradle wrapper if missing or corrupted
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Gradle wrapper jar not found. Generating fresh wrapper..."
            gradle wrapper --gradle-version 9.3.1
          fi

          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Build Debug APK
        if: "${{ github.event.inputs.build_type != 'release' }}"
        run: |
          echo "=== Building Debug APK ==="
          if [ -f ./gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            ./gradlew assembleDebug --stacktrace --no-daemon || gradle assembleDebug --stacktrace --no-daemon
          else
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Build Release APK
        if: "${{ github.event.inputs.build_type == 'release' }}"
        run: |
          echo "=== Building Release APK ==="
          export KEYSTORE_PATH="${PWD}/debug.keystore"
          export STORE_PASSWORD="android"
          export KEY_PASSWORD="android"
          if [ -f ./gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            ./gradlew assembleRelease --stacktrace --no-daemon || gradle assembleRelease --stacktrace --no-daemon
          else
            gradle assembleRelease --stacktrace --no-daemon
          fi

      - name: Locate and Verify APK
        id: apk-info
        run: |
          mkdir -p artifacts
          APK_PATH=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK file found in app/build/outputs/apk!"
            exit 1
          fi
          APK_NAME=$(basename "$APK_PATH")
          cp "$APK_PATH" "artifacts/$APK_NAME"
          APK_SIZE=$(ls -lh "artifacts/$APK_NAME" | awk '{print $5}')
          APK_SHA256=$(sha256sum "artifacts/$APK_NAME" | awk '{print $1}')
          
          echo "apk_path=artifacts/$APK_NAME" >> $GITHUB_OUTPUT
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT
          echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT
          echo "apk_sha256=$APK_SHA256" >> $GITHUB_OUTPUT
          
          echo "### 📱 APK Build Successful! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| **File Name** | \`$APK_NAME\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Size** | \`$APK_SIZE\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **SHA256** | \`$APK_SHA256\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk-info.outputs.apk_name }}
          path: artifacts/*.apk
          retention-days: 30

      - name: Create GitHub Release (On Tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true
